<!DOCTYPE html>
<html>

<head>

    <title>OOPSIBID Login Test</title>

    <style>

        body {
            font-family: Arial;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 5px 20px #ccc;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #19a463;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 15px;
            text-align: center;
        }

    </style>

</head>

<body>

<div class="box">

    <h2>OOPSIBID Login Test</h2>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Email"
            required>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required>

        <button type="submit">
            Login
        </button>

    </form>

    <div id="result"></div>

</div>


<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;

        const result =
            document.getElementById("result");

        try {

            const response = await fetch(
                "/api/auth/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );

            const message =
                await response.text();

            result.innerText = message;

            if (response.ok) {
                result.style.color = "green";
            } else {
                result.style.color = "red";
            }

        } catch (error) {

            result.innerText =
                "Unable to connect to server.";

            result.style.color = "red";
        }

    });

</script>

</body>

</html>
